name: "Automatic Shifting (Sequential Transmission)"
overview: "This plugin will automatically shift whilst having a sequential transmission. Supports Eco, Normal, and Power shift modes."
description: |
 Please note that this is a bit buggy but is better than nothing.

 Use Automatic Gearbox for the best experience. **AND DISABLE THIS PLUGIN IF YOU DO USE AN AUTOMATIC GEARBOX**

 **This plugin does not work with the H-Shifter option.**
